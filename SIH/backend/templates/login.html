<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Safar-Saathi Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #FDFBF7;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .login-container {
            width: 440px;
            background: #FFFFFF;

            padding: 40px;

            border-radius: 24px;
            border: 1px solid rgba(212, 160, 23, 0.35);

            box-shadow:
                0 20px 40px rgba(27, 67, 50, 0.12);
            position: relative;
            overflow: hidden;
        }

        .top-accent {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(to right, #8B5E34, #D4A017, #1B4332);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            margin: 0;
            color: #1B4332;
            font-size: 26px;
        }

        .logo p {
            color: #407153;
            font-size: 13px;
            margin-top: 4px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;

            font-weight: 600;
            color: #1B4332;
            font-size: 13px;
        }

        input,
        select {
            width: 100%;

            padding: 12px 14px;

            border: 1px solid #D4A017;
            border-radius: 12px;

            font-size: 14px;
            outline: none;
            background: #FAFAF8;
        }

        input:focus,
        select:focus {
            border-color: #1B4332;
            background: #FFFFFF;
        }

        button {
            width: 100%;

            margin-top: 25px;

            padding: 13px;

            border: none;
            border-radius: 12px;

            background: #1B4332;
            color: #FDFBF7;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background: #2D6A4F;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            color: #C0392B;
            font-size: 13px;
            font-weight: 500;
        }

    </style>
</head>

<body>

    <div class="login-container">
        <div class="top-accent"></div>

        <div class="logo">

            <h1>📦 Safar-Saathi</h1>

            <p>
                Shared Goods Transport & Logistics Platform
            </p>

        </div>


        <form id="loginForm">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                placeholder="Enter username"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >


            <label for="role">
                Login As
            </label>

            <select id="role" required>

                <option value="">
                    Select your role
                </option>

                <option value="user">
                    User
                </option>

                <option value="driver">
                    Driver
                </option>

            </select>


            <button type="submit">
                Login
            </button>

        </form>


        <p id="message"></p>

    </div>


    <script>

        document
            .getElementById("loginForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();


                const username =
                    document.getElementById("username").value;

                const password =
                    document.getElementById("password").value;

                const role =
                    document.getElementById("role").value;


                if (!role) {

                    document.getElementById("message")
                        .innerText = "Please select a role.";

                    return;
                }


                try {

                    const response = await fetch(
                        "/auth/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                username: username,
                                password: password,
                                role: role

                            })
                        }
                    );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        document.getElementById("message")
                            .innerText =
                            data.detail ||
                            "Login failed.";

                        return;
                    }


                    // Store JWT

                    localStorage.setItem(
                        "access_token",
                        data.access_token
                    );


                    localStorage.setItem(
                        "role",
                        data.role
                    );


                    // Redirect according to role

                    if (data.role === "admin") {

                        window.location.href =
                            "/admin";

                    }

                    else if (data.role === "driver") {

                        window.location.href =
                            "/driver";

                    }

                    else {

                        window.location.href =
                            "/user";

                    }

                }

                catch (error) {

                    document.getElementById("message")
                        .innerText =
                        "Unable to connect to server.";

                }

            });

    </script>

</body>

</html>
