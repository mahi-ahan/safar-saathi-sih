<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Krishi-Anna | User</title>

    <style>

        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background: #f5f7f5;
        }

        header {
            background: #2e7d32;

            color: white;

            padding: 20px 40px;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }

        header h1 {
            margin: 0;
        }

        .container {
            padding: 40px;
        }

        .cards {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(220px, 1fr)
                );

            gap: 20px;
        }

        .card {
            background: white;

            padding: 25px;

            border-radius: 12px;

            box-shadow:
                0 5px 15px
                rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            color: #2e7d32;
        }

        button {
            border: none;

            padding: 10px 18px;

            border-radius: 7px;

            background: #c62828;

            color: white;

            cursor: pointer;
        }

    </style>

</head>


<body>

<header>

    <h1>🌾 Krishi-Anna</h1>

    <button onclick="logout()">
        Logout
    </button>

</header>


<div class="container">

    <h2>
        Welcome, User
    </h2>

    <div class="cards">

        <div class="card">

            <h2>🚚 Find Trips</h2>

            <p>
                Find available transport trips
                for your agricultural produce.
            </p>

        </div>


        <div class="card">

            <h2>📦 My Requests</h2>

            <p>
                View and manage your transport
                requests.
            </p>

        </div>


        <div class="card">

            <h2>👤 Profile</h2>

            <p>
                View your account information.
            </p>

        </div>

    </div>

</div>


<script>

    // Check login

    const token =
        localStorage.getItem(
            "access_token"
        );

    const role =
        localStorage.getItem(
            "role"
        );


    if (!token || role !== "user") {

        window.location.href =
            "/login";

    }


    function logout() {

        localStorage.removeItem(
            "access_token"
        );

        localStorage.removeItem(
            "role"
        );

        window.location.href =
            "/login";

    }

</script>

</body>

</html>
